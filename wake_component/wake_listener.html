
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 12px;
    color: #333;
}
#status {
    padding: 12px;
    border-radius: 12px;
    background: #eeeaff;
    margin: 10px 0;
}
button {
    padding: 10px 18px;
    border: 0;
    border-radius: 10px;
    background: #6a4cff;
    color: white;
    cursor: pointer;
}
</style>
</head>
<body>
<h3>🎙️ Bhavi Voice Companion</h3>
<div id="status">Press Start and allow microphone access.</div>
<button id="start">Start voice activation</button>
<button id="stop">Stop</button>

<script>
const statusBox = document.getElementById("status");
const startButton = document.getElementById("start");
const stopButton = document.getElementById("stop");

const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition = null;
let enabled = false;
let waitingForCommand = false;
let restartTimer = null;

function setStatus(message) {
    statusBox.textContent = message;
}

if (!SpeechRecognition) {
    setStatus("Speech recognition is unavailable in this browser. Try Microsoft Edge or Chrome.");
    startButton.disabled = true;
} else {
    recognition = new SpeechRecognition();
    recognition.lang = "en-IN";
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onstart = () => {
        setStatus("Listening for “Bhavi” or “Hey Bhavi”...");
    };

    recognition.onresult = (event) => {
        let transcript = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript + " ";
        }

        const spoken = transcript.trim();
        const normalized = spoken.toLowerCase();

        if (!waitingForCommand &&
            /\b(hey\s+)?bhavi\b/i.test(normalized)) {
            waitingForCommand = true;

            const command = spoken
                .replace(/\bhey\s+bhavi\b/i, "")
                .replace(/\bbhavi\b/i, "")
                .trim();

            if (command.length > 0) {
                setStatus("Request detected: " + command);
                window.parent.postMessage({
                    type: "BHAVI_COMMAND",
                    text: command
                }, "*");
                waitingForCommand = false;
            } else {
                setStatus("Yes, I'm listening. Say your request.");
            }
        } else if (waitingForCommand && event.results[event.resultIndex].isFinal) {
            setStatus("Request detected: " + spoken);
            window.parent.postMessage({
                type: "BHAVI_COMMAND",
                text: spoken
            }, "*");
            waitingForCommand = false;
        }
    };

    recognition.onerror = (event) => {
        setStatus("Voice recognition: " + event.error +
                  ". Try Start again if needed.");
    };

    recognition.onend = () => {
        if (enabled) {
            clearTimeout(restartTimer);
            restartTimer = setTimeout(() => {
                if (enabled) {
                    try {
                        recognition.start();
                    } catch (e) {
                        setStatus("Restarting voice listener...");
                    }
                }
            }, 700);
        }
    };

    startButton.onclick = () => {
        enabled = true;
        try {
            recognition.start();
        } catch (e) {
            setStatus("Listener is starting. Please wait.");
        }
    };

    stopButton.onclick = () => {
        enabled = false;
        clearTimeout(restartTimer);
        recognition.stop();
        waitingForCommand = false;
        setStatus("Voice activation stopped.");
    };
}
</script>
</body>
</html>
